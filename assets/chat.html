<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话记录</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#20242b;font:15px/1.6 system-ui,sans-serif}header{background:white;border-bottom:1px solid #ddd;padding:20px;position:sticky;top:0;z-index:1}header>div,main{max-width:960px;margin:auto}main{padding:20px}h1{font-size:23px;margin:0}p{margin:5px 0;color:#647084}form{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}input,select,button{font:inherit;padding:8px 12px;border:1px solid #ccd1db;border-radius:8px;background:white}input[type=search]{flex:1;min-width:180px}button{cursor:pointer}button:disabled{opacity:.4}.message{max-width:85%;margin:16px 0}.mine{margin-left:auto}.meta{font-size:12px;color:#647084;margin-bottom:4px}.mine .meta{text-align:right}.body{background:white;border-radius:12px;padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere}.mine .body{background:#d9f5d4}details{font-size:12px;margin-top:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.nav{display:flex;justify-content:center;align-items:center;gap:14px;margin:20px}.note{font-size:12px}a{display:block;color:#2259b8}
</style>
<header><div><h1 id="title">会话记录</h1><p id="range"></p><p id="note" class="note"></p><form id="filters"><input id="search" type="search" placeholder="搜索正文" aria-label="搜索正文"><select id="sender" aria-label="发送者"><option value="">全部发送者</option><option>我</option><option>对方</option><option>系统</option></select><input id="start" type="date" aria-label="开始日期"><input id="end" type="date" aria-label="结束日期"><button>查找</button></form><p id="status" aria-live="polite"></p></div></header>
<main><nav class="nav"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></nav><section id="messages"></section><nav class="nav"><button id="first">第一页</button><button id="last">最后一页</button></nav></main>
<script type="application/json" id="data">CHAT_DATA_PLACEHOLDER</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),all=data.messages,size=100;
let filtered=all,page=0;
const byId=id=>document.getElementById(id);
byId('title').textContent='我与'+(data.summary.contact.remark||data.summary.contact.nick_name||data.summary.contact.username);
byId('range').textContent=`${data.summary.first_time.slice(0,10)} 至 ${data.summary.last_time.slice(0,10)} · ${all.length.toLocaleString()} 条 · 北京时间`;
byId('note').textContent=data.summary.attachment_note;
function render(){const pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages-1);byId('messages').replaceChildren();for(const item of filtered.slice(page*size,(page+1)*size)){const box=document.createElement('article');box.className='message'+(item.sender==='我'?' mine':'');const meta=document.createElement('div');meta.className='meta';meta.textContent=`${item.sender} · ${item.time.slice(0,19).replace('T',' ')} · ${item.type_name}`;const body=document.createElement('div');body.className='body';body.textContent=item.display_text;box.append(meta,body);for(const attachment of item.attachments){const link=document.createElement('a');link.href=attachment.path;link.download='';link.textContent='保存附件 · '+attachment.status;box.append(link)}if(item.local_type!==1){const details=document.createElement('details'),summary=document.createElement('summary'),raw=document.createElement('pre');summary.textContent='查看原始内容';raw.textContent=item.message_content;details.append(summary,raw);box.append(details)}byId('messages').append(box)}byId('page').textContent=`${page+1} / ${pages}`;byId('status').textContent=`找到 ${filtered.length.toLocaleString()} 条消息`;byId('prev').disabled=page===0;byId('next').disabled=page===pages-1}
byId('filters').onsubmit=e=>{e.preventDefault();const q=byId('search').value.toLowerCase(),sender=byId('sender').value,start=byId('start').value,end=byId('end').value;filtered=all.filter(m=>(!q||m.display_text.toLowerCase().includes(q))&&(!sender||m.sender===sender)&&(!start||m.time.slice(0,10)>=start)&&(!end||m.time.slice(0,10)<=end));page=0;render()};
byId('prev').onclick=()=>{page--;render();window.scrollTo(0,0)};byId('next').onclick=()=>{page++;render();window.scrollTo(0,0)};byId('first').onclick=()=>{page=0;render();window.scrollTo(0,0)};byId('last').onclick=()=>{page=Math.max(0,Math.ceil(filtered.length/size)-1);render();window.scrollTo(0,0)};render();
</script></html>
